<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contract Guardian</title>
    <meta name="description" content="Upload a CSV, check it against a data contract, and get plain-language fixes for every problem." />
    <script>
      // Set the theme before the page paints so there is no flash.
      try {
        var t = localStorage.getItem("dcg-theme");
        if (!t && window.matchMedia("(prefers-color-scheme: light)").matches) t = "light";
        document.documentElement.dataset.theme = t || "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
